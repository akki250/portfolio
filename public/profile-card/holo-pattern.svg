<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none">
  <!-- Tileable alpha mask pattern: transparent background, opaque geometric icons so holo foil shines only through the icons -->
  <g stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <!-- Top-left: Code brackets </> -->
    <path d="M18 22 L10 30 L18 38" />
    <path d="M38 22 L46 30 L38 38" />
    <path d="M31 19 L25 41" />

    <!-- Top-right: Torii / Temple gate icon -->
    <path d="M72 20 H108" stroke-width="3" />
    <path d="M76 27 H104" />
    <path d="M81 20 V44 M99 20 V44" />

    <!-- Center: Diamond Kumiko / IC Chip node -->
    <polygon points="60,46 74,60 60,74 46,60" fill="#ffffff" fill-opacity="0.28" />
    <circle cx="60" cy="60" r="4" fill="#ffffff" />
    <path d="M60 38 V46 M60 74 V82 M38 60 H46 M74 60 H82" />

    <!-- Bottom-left: Microprocessor / PCB pads -->
    <rect x="16" y="78" width="24" height="24" rx="4" fill="#ffffff" fill-opacity="0.22" />
    <path d="M22 72 V78 M28 72 V78 M34 72 V78" />
    <path d="M22 102 V108 M28 102 V108 M34 102 V108" />
    <path d="M10 84 H16 M10 90 H16 M10 96 H16" />
    <path d="M40 84 H46 M40 90 H46 M40 96 H46" />

    <!-- Bottom-right: Terminal prompt >_ & circuit trace -->
    <path d="M76 82 L86 90 L76 98" />
    <path d="M90 98 H104" />
  </g>

  <!-- Subtle corner constellation dots for continuous holo shimmer -->
  <g fill="#ffffff" opacity="0.75">
    <circle cx="60" cy="14" r="2.2" />
    <circle cx="14" cy="60" r="2.2" />
    <circle cx="106" cy="60" r="2.2" />
    <circle cx="60" cy="106" r="2.2" />
  </g>
</svg>
